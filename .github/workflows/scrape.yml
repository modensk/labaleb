name: Сбор составов

on:
  push:
    paths:
      - "scraper/**"
      - ".github/workflows/scrape.yml"
  workflow_dispatch:
    inputs:
      leagues:
        description: "ID лиг через запятую (пусто = все)"
        required: false
        default: ""
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 pillow
      - name: Собрать данные
        env:
          LEAGUES: ${{ github.event.inputs.leagues }}
        run: python scraper/scrape.py
      - name: Сохранить в репозиторий
        if: always()
        run: |
          git config user.name "labaleb-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "нет изменений"; exit 0; fi
          git commit -m "data: обновление составов $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
